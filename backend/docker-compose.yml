version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb+srv://debang:dlmn8tLVXbxkfPm0@node.ycam3wk.mongodb.net/messageing-app
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=cUl5Mdlo1LbyJvuGuTKAll2igfDp557OaaDqqeMf4xM
      - NODE_ENV=production
    depends_on:
      - mongo
      - redis
    restart: always

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always

volumes:
  mongo-data:
